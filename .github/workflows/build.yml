name: Build Windows & Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: WorldSim-Ages-Windows
          path: |
            release/WorldSim-Ages-Setup-*.exe
            release/WorldSim-Ages-Portable-*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../WorldSim-Ages.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WorldSim-Ages-Android
          path: WorldSim-Ages.apk

  release:
    # Publishes a GitHub Release with the installer, portable exe and APK on every
    # push (and on v* tags). Pull requests only build artifacts.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Pick release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: WorldSim Ages ${{ steps.tag.outputs.tag }}
          make_latest: true
          body: |
            **Downloads**
            - **WorldSim-Ages.apk** — Android. Open it on your phone and allow installing from unknown sources.
            - **WorldSim-Ages-Setup-*.exe** — Windows installer (Start menu + desktop shortcut).
            - **WorldSim-Ages-Portable-*.exe** — Windows, no install: just run it.

            The Windows builds are unsigned, so SmartScreen may warn on first launch: click *More info* → *Run anyway*.
          files: dist-artifacts/*
