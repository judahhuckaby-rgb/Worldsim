name: Build Windows & Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Compute version (major.minor from package.json, patch = build number)
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm pkg set version=${{ needs.version.outputs.version }}
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: WorldSim-Ages-Windows
          path: |
            release/WorldSim-Ages-Setup-*.exe
            release/WorldSim-Ages-Setup-*.exe.blockmap
            release/WorldSim-Ages-Portable-*.exe
            release/latest.yml

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm pkg set version=${{ needs.version.outputs.version }}
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PappVersionName=${{ needs.version.outputs.version }} -PappVersionCode=${{ needs.version.outputs.code }}
          cp app/build/outputs/apk/debug/app-debug.apk ../WorldSim-Ages.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WorldSim-Ages-Android
          path: WorldSim-Ages.apk

  release:
    # Publishes a GitHub Release (installer, portable exe, APK and auto-update metadata) on every push.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [version, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: WorldSim Ages v${{ needs.version.outputs.version }}
          make_latest: true
          body: |
            **Downloads**
            - **WorldSim-Ages.apk** — Android. Open it on your phone and allow installing from unknown sources. Later versions update from inside the app.
            - **WorldSim-Ages-Setup-*.exe** — Windows installer. Updates itself automatically.
            - **WorldSim-Ages-Portable-*.exe** — Windows, no install: just run it (shows when an update is available).

            The Windows builds are unsigned, so SmartScreen may warn on first launch: click *More info* → *Run anyway*.
          files: dist-artifacts/*
